# CI do Controlei (spec 07 do JavAI). Actions fixadas por SHA e permissões mínimas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Contratos de eventos
        run: mvn -B -f back/shared-events/pom.xml install -DskipTests
      - name: Build e testes
        run: mvn -B -f back/pom.xml verify

  front:
    name: Front (Angular 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # O runner já traz Node LTS; sem action de terceiros além das fixadas acima.
      - name: Instalar dependências
        run: npm ci --prefix front
      - name: Testes
        run: npx ng test --watch=false
        working-directory: front
        env:
          CI: 'true'
      - name: Build de produção
        run: npx ng build
        working-directory: front
      - name: PWA gerado (service worker, manifest e ícones) e sem handlers inline
        working-directory: front
        run: |
          for f in ngsw.json ngsw-worker.js manifest.webmanifest favicon.ico icons/favicon.svg icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png; do
            test -f "dist/front/browser/$f" || { echo "O build nao gerou $f"; exit 1; }
          done
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/front/browser/manifest.webmanifest','utf8'));
            if(m.display!=='standalone'||!m.icons.some(i=>i.sizes==='512x512'&&i.purpose==='maskable')) throw new Error('manifest incompleto');
            console.log('manifest ok:', m.short_name, m.display)"
          # O CSP do gateway (script-src 'self') bloqueia onclick/onchange inline: eles quebram so em producao.
          if grep -rEn --include=*.html '\son(click|change|input|submit|load|error)="' src; then
            echo "Handler inline encontrado: use (click)/(change) do Angular"; exit 1
          fi

  compose:
    name: Compose válido
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar sintaxe e exigencia dos segredos
        env:
          JWT_SECRET: 'segredo-de-ci-com-mais-de-32-caracteres-xyz'
          DB_PASSWORD: ci-senha-descartavel
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          if JWT_SECRET= docker compose config -q 2>/dev/null; then
            echo "O compose deveria exigir JWT_SECRET" && exit 1
          fi
          if DB_PASSWORD= docker compose config -q 2>/dev/null; then
            echo "O compose deveria exigir DB_PASSWORD" && exit 1
          fi
      - name: So o gateway publica porta
        env:
          JWT_SECRET: 'segredo-de-ci-com-mais-de-32-caracteres-xyz'
          DB_PASSWORD: ci-senha-descartavel
        run: |
          # Postgres, Redis e Kafka ficam so na rede interna; portas de depuracao existem apenas no override de dev
          published=$(docker compose config | grep -c 'published:')
          if [ "$published" != "1" ]; then
            echo "Esperada 1 porta publicada (nginx), encontradas $published" && exit 1
          fi
      - name: Compose da VPS nao publica porta nenhuma
        env:
          JWT_SECRET: 'segredo-de-ci-com-mais-de-32-caracteres-xyz'
          DB_PASSWORD: ci-senha-descartavel
          REDIS_PASSWORD: ci-redis-descartavel
          CONTROLEI_TAG: ci
          TAILSCALE_IP: 100.64.0.1
        run: |
          docker compose -f docker-compose.vps.yml config -q
          # Em producao o unico caminho de entrada e o Caddy, pela rede externa; o Kafka UI so existe no override
          # da tailnet, preso ao IP da Tailscale.
          # grep -c devolve 1 quando a contagem e zero (o resultado certo aqui); sem o || true, o `bash -e` do runner aborta
          published=$(docker compose -f docker-compose.vps.yml config | grep -c 'published:' || true)
          if [ "$published" != "0" ]; then
            echo "A VPS nao pode publicar porta (encontradas $published)" && exit 1
          fi
          docker compose -f docker-compose.vps.yml -f docker-compose.tailnet.yml config | grep -q "host_ip: 100.64.0.1"
          for var in DB_PASSWORD REDIS_PASSWORD JWT_SECRET; do
            if env "$var=" docker compose -f docker-compose.vps.yml config -q 2>/dev/null; then
              echo "O compose da VPS deveria exigir $var" && exit 1
            fi
          done
      - name: Gateway libera o microfone so para o proprio site (voz do assistente)
        run: |
          # microphone=() bloqueia o getUserMedia atras do gateway e a voz para de funcionar so em producao
          policy=$(grep -o 'Permissions-Policy "[^"]*"' nginx/nginx.conf)
          echo "$policy"
          echo "$policy" | grep -q 'microphone=(self)' || { echo "Permissions-Policy precisa de microphone=(self)"; exit 1; }
          echo "$policy" | grep -q 'camera=()' || { echo "camera deve continuar bloqueada"; exit 1; }
          echo "$policy" | grep -q 'geolocation=()' || { echo "geolocation deve continuar bloqueada"; exit 1; }
      - name: Configuracao do gateway e do front passa no nginx -t
        run: |
          # Os upstreams se chamam back e front; fora do Compose eles nao resolvem, entao apontam para o loopback
          docker run --rm --add-host back:127.0.0.1 --add-host front:127.0.0.1             -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"             -v "$PWD/nginx/proxy_api.conf:/etc/nginx/proxy_api.conf:ro"             nginxinc/nginx-unprivileged:1.30-alpine nginx -t
          docker run --rm -v "$PWD/front/nginx.conf:/etc/nginx/conf.d/default.conf:ro"             nginxinc/nginx-unprivileged:1.30-alpine nginx -t

  # Imagens no GHCR: so depois que back, front e compose passaram, e so na main. A VPS nunca compila nada.
  images:
    name: Imagens no GHCR
    needs: [back, front, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/gilvan-borges
      TAG: ${{ github.sha }}
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build das imagens (o back compila dentro da propria imagem)
        run: |
          docker build -t "$REGISTRY/controlei-back:$TAG" back
          docker build -t "$REGISTRY/controlei-front:$TAG" front
      - name: Trivy (falha com vulnerabilidade alta ou critica que ja tem correcao)
        run: |
          for image in controlei-back controlei-front; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$REGISTRY/$image:$TAG"
          done
      - name: Publica no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          for image in controlei-back controlei-front; do
            docker push "$REGISTRY/$image:$TAG"
          done

  # Deploy na VPS pela Tailscale (deploy/README.md). Desligado ate a variavel do repositorio DEPLOY_ENABLED valer
  # "true", o que so acontece depois do primeiro deploy manual.
  deploy:
    name: Deploy na VPS
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: producao
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      # Aparelho temporario na tailnet, autenticado por OIDC: nenhum segredo da Tailscale fica no GitHub. A politica
      # da tailnet so deixa o tag:ci-javai chegar na porta 22 da javai-vps. A tag:ci e de outro projeto.
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:ci-javai
          ping: ${{ vars.DEPLOY_HOST }}
      # O usuario deploy-controlei so aceita o SHA do commit (comando forcado). O GITHUB_TOKEN vai pelo stdin, so
      # para baixar as imagens e os arquivos de infra, e expira quando o job termina.
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 "deploy-controlei@$DEPLOY_HOST" "$TAG"
