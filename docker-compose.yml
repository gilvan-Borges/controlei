services:
  # 1. Banco de Dados Relacional
  postgres:
    image: postgres:16-alpine
    container_name: controlei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-controlei}
      POSTGRES_USER: ${DB_USER:-controlei}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-controlei123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-controlei} -d ${DB_NAME:-controlei}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - controlei-network

  # 2. Cache em Memória, Locks Distribuídos & Idempotência (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: controlei-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - controlei-network

  # 3. Apache Kafka (KRaft Mode - Apache 3.8 sem Zookeeper)
  kafka:
    image: apache/kafka:3.8.0
    container_name: controlei-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - controlei-network

  # 4. Kafka UI (Monitoramento de Tópicos, Mensagens e Consumer Groups)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: controlei-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: controlei-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    networks:
      - controlei-network

  # 5. Keycloak 26 (Identity & Access Management - OIDC / OAuth2)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: controlei-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${DB_NAME:-controlei}
      KC_DB_USERNAME: ${DB_USER:-controlei}
      KC_DB_PASSWORD: ${DB_PASSWORD:-controlei123}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HEALTH_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - controlei-network

  # 6. Backend Spring Boot (Clean Architecture & Event-Driven)
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: controlei-back
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-controlei}
      DB_USER: ${DB_USER:-controlei}
      DB_PASSWORD: ${DB_PASSWORD:-controlei123}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (minimo 32 caracteres)}
      CONTROLEI_AI_ENABLED: ${CONTROLEI_AI_ENABLED:-false}
      CONTROLEI_AI_API_KEY: ${CONTROLEI_AI_API_KEY:-}
      CONTROLEI_AI_MODEL: ${CONTROLEI_AI_MODEL:-google/gemini-2.5-flash}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4200,http://localhost:8085,http://localhost:8080}
      APP_SEED_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - controlei-network

  # 7. Frontend Angular SPA
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: controlei-front
    restart: unless-stopped
    depends_on:
      - back
    networks:
      - controlei-network

  # 8. Reverse Proxy / Gateway Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: controlei-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - back
    networks:
      - controlei-network

volumes:
  postgres_data:
  redis_data:

networks:
  controlei-network:
    driver: bridge
