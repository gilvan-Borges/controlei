services:
  # 1. Banco de Dados Relacional
  postgres:
    image: postgres:16-alpine
    container_name: controlei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-controlei}
      POSTGRES_USER: ${DB_USER:-controlei}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    # Sem "ports": o banco so existe dentro da rede do Compose. Para inspecionar localmente use
    # `docker compose exec postgres psql` ou o override docker-compose.dev.yml (portas em 127.0.0.1).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-controlei} -d ${DB_NAME:-controlei}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - controlei-network

  # 2. Cache em Memória, Locks Distribuídos & Idempotência (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: controlei-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - controlei-network

  # 3. Apache Kafka (KRaft Mode - Apache 3.8 sem Zookeeper)
  kafka:
    image: apache/kafka:3.8.0
    container_name: controlei-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - controlei-network

  # 4. Backend Spring Boot (Clean Architecture & Event-Driven)
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: controlei-back
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-controlei}
      DB_USER: ${DB_USER:-controlei}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (minimo 32 caracteres)}
      CONTROLEI_AI_ENABLED: ${CONTROLEI_AI_ENABLED:-false}
      CONTROLEI_AI_API_KEY: ${CONTROLEI_AI_API_KEY:-}
      CONTROLEI_AI_MODEL: ${CONTROLEI_AI_MODEL:-google/gemini-2.5-flash}
      CONTROLEI_AI_DAILY_LIMIT: ${CONTROLEI_AI_DAILY_LIMIT:-30}
      OPENFINANCE_WEBHOOK_SECRET: ${OPENFINANCE_WEBHOOK_SECRET:-}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Seed de usuarios de demonstracao: desligado. Ligue so em ambiente local, com senha propria.
      APP_SEED_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - controlei-network

  # 5. Frontend Angular SPA
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: controlei-front
    restart: unless-stopped
    depends_on:
      - back
    networks:
      - controlei-network

  # 6. Reverse Proxy / Gateway Nginx: a UNICA porta publicada
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: controlei-nginx
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_api.conf:/etc/nginx/proxy_api.conf:ro
    tmpfs:
      - /tmp
    depends_on:
      - front
      - back
    networks:
      - controlei-network

volumes:
  postgres_data:
  redis_data:

networks:
  controlei-network:
