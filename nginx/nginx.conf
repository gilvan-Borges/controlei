worker_processes auto;
# Imagem sem root e sistema de arquivos somente leitura: o pid e os temporarios vao para /tmp (tmpfs)
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nao anuncia a versao do nginx nas respostas e paginas de erro
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Atras do Caddy da VPS, a conexao vem do Caddy: o IP do visitante chega no X-Real-IP, e SO e aceito quando a
    # conexao vem da rede controlei-edge (subnet fixa, ver deploy/README.md). Fora dela, o cabecalho e ignorado.
    # Sem isto, todos os visitantes dividiriam o mesmo limite de requisicoes (o IP do Caddy).
    set_real_ip_from 172.30.50.0/24;
    real_ip_header   X-Real-IP;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /dev/stdout  main;
    error_log   /dev/stderr  warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Limites por IP de conexao. O nginx e o primeiro ponto de entrada, entao $binary_remote_addr nao e forjavel.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

    upstream backend_upstream {
        server back:8080;
        keepalive 32;
    }

    upstream frontend_upstream {
        server front:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Um pouco acima do limite da API (10 MB por arquivo); a API rejeita o excesso com mensagem clara
        client_max_body_size 11M;

        # Cabecalhos de seguranca (a CSP nao usa 'unsafe-inline' em scripts: o build desliga o CSS critico inline). TLS e HSTS ficam no ponto de entrada publico (ex.: Cloudflare ou um
        # proxy com certificado); atras dele, ative o HSTS aqui com
        #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Reduz o estrago de um XSS (o token fica no localStorage): so scripts do proprio site.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # Nunca expoe o actuator pelo gateway
        location /actuator/ {
            return 404;
        }

        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;
            include /etc/nginx/proxy_api.conf;
            proxy_read_timeout 60s;
            proxy_pass http://backend_upstream;
        }

        location /api/v1/auth/register-family {
            limit_req zone=auth_limit burst=2 nodelay;
            include /etc/nginx/proxy_api.conf;
            proxy_read_timeout 60s;
            proxy_pass http://backend_upstream;
        }

        # Leitura de comprovante: cada chamada pode custar uma consulta ao modelo
        location /api/v1/receipts/ {
            limit_req zone=upload_limit burst=5 nodelay;
            include /etc/nginx/proxy_api.conf;
            proxy_read_timeout 90s;
            proxy_pass http://backend_upstream;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            include /etc/nginx/proxy_api.conf;
            proxy_read_timeout 90s;
            proxy_pass http://backend_upstream;
        }

        # Frontend Angular SPA
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
