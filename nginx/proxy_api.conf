# Cabecalhos comuns de proxy para a API.
# X-Real-IP e X-Forwarded-For recebem SOMENTE o IP da conexao: o que o cliente enviar nesses cabecalhos e descartado,
# senao ele poderia forjar o IP e fugir do limite de requisicoes da aplicacao.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
