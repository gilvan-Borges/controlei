# Controlei na VPS do JavAI (spec 07 e deploy/README.md).
#
# Diferencas para o docker-compose.yml (desenvolvimento e teste local):
#   - as imagens vem do GHCR (publicadas pelo CI): a VPS nunca compila nada;
#   - NENHUMA porta e publicada no host. O unico caminho de entrada e o Caddy do JavAI, que entra pela rede
#     externa "controlei-edge" e fala com o gateway. Ferramentas internas (Kafka UI) so existem no override
#     docker-compose.tailnet.yml, presas ao IP da Tailscale;
#   - cada servico tem teto de memoria: a VPS e compartilhada com o JavAI e o Controlei nao pode derrubar vizinhos;
#   - sistema de arquivos somente leitura, sem capabilities, sem escalada de privilegio.
#
# Instalado na VPS como /opt/controlei/docker-compose.yml pelo script deploy/controlei-deploy-root.

name: controlei

x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:

  postgres:
    <<: *endurecido
    image: postgres:16-alpine
    user: "70:70"
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
      - -c
      - log_connections=on
    environment:
      POSTGRES_DB: ${DB_NAME:-controlei}
      POSTGRES_USER: ${DB_USER:-controlei}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks: [data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-controlei} -d ${DB_NAME:-controlei}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *endurecido
    image: redis:7-alpine
    user: "999:999"
    # Idempotencia e locks sao efemeros: sem persistencia, com teto de memoria e senha. A senha vai por variavel de
    # ambiente (e nao no comando) para nao aparecer em `ps` nem em `docker inspect` como argumento.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 48mb --maxmemory-policy volatile-ttl
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina no .env}
    networks: [data]
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Um unico no, so na rede interna "data" (sem rota para fora). Heap pequeno e retencao curta: o volume de
      # eventos de uma familia e minimo, e o disco e compartilhado.
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx384m"
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [data]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s

  back:
    <<: *endurecido
    image: ghcr.io/gilvan-borges/controlei-back:${CONTROLEI_TAG:?defina no .env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-controlei}
      DB_USER: ${DB_USER:-controlei}
      DB_PASSWORD: ${DB_PASSWORD:?defina no .env}
      DB_POOL_SIZE: 10
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      JWT_EXPIRATION_MINUTES: 15
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina no .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-https://controlei.gilvanborges.com.br}
      APP_SEED_ENABLED: "false"
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      OPENFINANCE_WEBHOOK_SECRET: ${OPENFINANCE_WEBHOOK_SECRET:-}
      CONTROLEI_AI_ENABLED: ${CONTROLEI_AI_ENABLED:-false}
      CONTROLEI_AI_API_KEY: ${CONTROLEI_AI_API_KEY:-}
      CONTROLEI_AI_MODEL: ${CONTROLEI_AI_MODEL:-google/gemini-2.5-flash}
      CONTROLEI_AI_DAILY_LIMIT: ${CONTROLEI_AI_DAILY_LIMIT:-30}
    tmpfs:
      - /tmp
    # "app" tem saida para a internet (OpenRouter, quando a IA esta ligada); "data" nao tem.
    networks: [app, data]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  front:
    <<: *endurecido
    image: ghcr.io/gilvan-borges/controlei-front:${CONTROLEI_TAG:?defina no .env}
    tmpfs:
      - /tmp
    networks: [app]
    mem_limit: 32m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Gateway interno: limites por IP, CSP e roteamento /api -> back. E o unico servico na rede de borda: o Caddy do
  # JavAI chega nele pelo alias "controlei-gateway".
  gateway:
    <<: *endurecido
    image: nginxinc/nginx-unprivileged:1.30-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_api.conf:/etc/nginx/proxy_api.conf:ro
    tmpfs:
      - /tmp
    networks:
      app: {}
      edge:
        aliases: [controlei-gateway]
    mem_limit: 48m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:

networks:
  # Sem rota para a internet: banco, Redis e Kafka so conversam com o back.
  data:
    internal: true
  app: {}
  # Entre o Caddy do JavAI e o gateway, e nada mais. Criada a mao, com subnet fixa (o gateway so confia no
  # X-Real-IP vindo dela): docker network create --subnet 172.30.50.0/24 controlei-edge
  edge:
    external: true
    name: controlei-edge
