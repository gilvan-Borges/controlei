spring.datasource.url=jdbc:h2:mem:controlei_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/test
spring.flyway.validate-on-migrate=true

jwt.secret=test-secret-must-be-at-least-256-bits-long-for-hs256
jwt.expiration-minutes=15
jwt.refresh-expiration-days=7

app.security.rate-limit.enabled=false

logging.level.br.com.controlei=INFO

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Kafka e Redis nao existem nos testes: listeners desligados e publicador sem rede (ver TestMessagingConfig)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
management.health.redis.enabled=false

# Custo baixo de BCrypt so nos testes (em producao o padrao e 12)
app.security.bcrypt-strength=4
# Segredo do webhook do Open Finance usado pelos testes
app.openfinance.webhook-secret=test-webhook-secret

# O relay do outbox nao roda sozinho nos testes: eles chamam drain() quando querem (ver OutboxIntegrationTest)
app.outbox.relay.enabled=false
