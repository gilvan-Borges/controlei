spring.application.name=ControleiApi
spring.profiles.active=local

spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false

# Somente desenvolvimento local. O perfil prod exige JWT_SECRET (sem valor padrao).
jwt.secret=${JWT_SECRET:dev-only-secret-not-for-production-0123456789}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Upload: limite explicito (o padrao do Spring seria 1 MB e tornaria a regra de 10 MB inalcancavel)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Cota diaria de leituras por IA por familia (acima disso a leitura cai no plano B)
controlei.ai.daily-limit-per-family=${CONTROLEI_AI_DAILY_LIMIT:30}

# Voz do assistente. Sem variavel propria: segue a IA do servidor (mesmo interruptor, mesma chave e mesmo provedor, o
# OpenRouter). Transcricao: /audio/transcriptions no formato do OpenRouter (JSON com base64). Fala: /audio/speech pelo
# Spring AI (formato da OpenAI, que o OpenRouter segue). Com provider=openai, a transcricao tambem vai pelo Spring AI.
# Cada familia ainda precisa ativar a voz no assistente (so o responsavel, com aceite: o audio sai do servidor).
controlei.voice.enabled=${controlei.ai.enabled:false}
controlei.voice.api-key=${controlei.ai.api-key:}
controlei.voice.base-url=${controlei.ai.base-url:https://openrouter.ai/api/v1}
controlei.voice.provider=openrouter
# Whisper Large V3 Turbo: aceita webm, ogg, mp3, mp4 e wav, 99+ idiomas, ~33x mais barato que o whisper-1
controlei.voice.stt-model=openai/whisper-large-v3-turbo
controlei.voice.tts-model=openai/gpt-4o-mini-tts-2025-12-15
controlei.voice.tts-voice=alloy
controlei.ai.voice-daily-limit-per-family=20

# Bloqueio de login por e-mail: 5 falhas seguidas travam a conta por 15 minutos
app.security.login.max-failures=5
app.security.login.lock-minutes=15

# Webhook do Open Finance: sem segredo, nenhum webhook e aceito
app.openfinance.webhook-secret=${OPENFINANCE_WEBHOOK_SECRET:}

# Cadastro de novas familias. Em uma instancia publica, fechar depois de criar a propria conta evita que desconhecidos
# criem contas (e gastem a cota de IA). Quem ja tem conta continua entrando.
app.registration.enabled=${REGISTRATION_ENABLED:true}
# Modo demonstracao: botao "Entrar como visitante" numa familia ficticia, recriada todo dia (cron no horario de Brasilia)
app.demo.enabled=${DEMO_MODE:false}
app.demo.reset-cron=${DEMO_RESET_CRON:0 0 4 * * *}
