spring.application.name=ControleiApi
spring.profiles.active=local

spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false

# Somente desenvolvimento local. O perfil prod exige JWT_SECRET (sem valor padrao).
jwt.secret=${JWT_SECRET:dev-only-secret-not-for-production-0123456789}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Upload: limite explicito (o padrao do Spring seria 1 MB e tornaria a regra de 10 MB inalcancavel)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Cota diaria de leituras por IA por familia (acima disso a leitura cai no plano B)
controlei.ai.daily-limit-per-family=${CONTROLEI_AI_DAILY_LIMIT:30}

# Bloqueio de login por e-mail: 5 falhas seguidas travam a conta por 15 minutos
app.security.login.max-failures=5
app.security.login.lock-minutes=15

# Webhook do Open Finance: sem segredo, nenhum webhook e aceito
app.openfinance.webhook-secret=${OPENFINANCE_WEBHOOK_SECRET:}
