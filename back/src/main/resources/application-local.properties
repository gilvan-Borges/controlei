server.port=8080
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://localhost:8085,http://localhost:8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:controlei}
spring.datasource.username=${DB_USER:controlei}
spring.datasource.password=${DB_PASSWORD:controlei123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# Redis Cache & Locks (Local)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

# Apache Kafka Event Streaming (KRaft)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=controlei-local-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.controlei.*

logging.level.br.com.controlei=INFO
logging.level.org.apache.kafka=WARN

app.seed.enabled=true
app.seed.family-name=Familia Borges
app.seed.super-admin-name=Super Admin
app.seed.super-admin-email=superadmin@controlei.local
app.seed.super-admin-password=Controlei@123
app.seed.member-name=Gilvan Borges
app.seed.member-email=gilvan.borges@controlei.local
app.seed.member-password=Controlei@123

# IA nos comprovantes (opcional): CONTROLEI_AI_ENABLED=true e CONTROLEI_AI_API_KEY=<chave OpenRouter>
controlei.ai.enabled=${CONTROLEI_AI_ENABLED:false}
controlei.ai.api-key=${CONTROLEI_AI_API_KEY:}
controlei.ai.model=${CONTROLEI_AI_MODEL:google/gemini-2.5-flash}
