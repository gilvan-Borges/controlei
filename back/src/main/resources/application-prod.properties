server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:controlei}
spring.datasource.username=${DB_USER:controlei}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Redis Cache & Locks
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000
# Redis exige senha (o contêiner usa --requirepass); vazio so em desenvolvimento
spring.data.redis.password=${REDIS_PASSWORD:}

# Apache Kafka Event Streaming (KRaft)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retry.backoff.ms=500

spring.kafka.consumer.group-id=controlei-core-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.controlei.*
spring.kafka.listener.ack-mode=RECORD

logging.level.br.com.controlei=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN

# Segredo obrigatorio em producao: sem JWT_SECRET a aplicacao nao sobe
jwt.secret=${JWT_SECRET}

# IA nos comprovantes: desligada por padrao porque a imagem sai do servidor para o provedor
controlei.ai.enabled=${CONTROLEI_AI_ENABLED:false}
controlei.ai.api-key=${CONTROLEI_AI_API_KEY:}
controlei.ai.model=${CONTROLEI_AI_MODEL:google/gemini-2.5-flash}

# O nginx (unico ponto de entrada) escreve X-Real-IP com o IP da conexao; so entao o cabecalho e confiavel
app.security.rate-limit.trust-proxy-headers=true

# Em producao so a saude e exposta; metricas e detalhes ficam de fora do que o gateway publica
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
