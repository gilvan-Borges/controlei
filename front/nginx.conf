# Servidor interno do front. Quem recebe o trafego e o gateway (nginx/nginx.conf), que roteia /api para o back:
# este container so entrega os arquivos estaticos do Angular. (Havia aqui um proxy de /api para
# host.docker.internal, caminho morto no Compose e uma porta de saida desnecessaria para a maquina hospedeira.)
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Service worker e manifest: se o navegador guardasse esses arquivos por um ano, o app instalado nunca receberia versao
  # nova. Sempre revalidados (o ngsw.json lista os hashes de tudo o que o worker deve baixar).
  location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Arquivos com hash no nome (main-ABC123.js): nunca mudam, podem ficar um ano no cache do navegador
  location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O index.html referencia os arquivos com hash: precisa ser revalidado a cada visita para pegar a versao nova
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
